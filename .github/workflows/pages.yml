name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A49793: ${{ secrets.A49793 }}
          B0DC3B: ${{ secrets.B0DC3B }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A49793', ''), os.environ.get('B0DC3B', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- f0bf37891e003907a9476740cd0205460bcf -->', a)
          if b:
              patched = patched.replace('<!-- 884bee3edff049cc5ae52fc52c8c44911d24536aec -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
